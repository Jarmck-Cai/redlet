<!doctype html><meta charset="utf-8"><div class="user-info"><span class="name-box">Redlet demo</span></div>
<div class="tab-list"><div class="tab-item tab-item--active">已发布</div><div class="tab-item">审核中</div><div class="tab-item">未通过</div></div>
<div class="search-input"><input placeholder="搜索已发布的笔记" value=""></div><section class="content"></section>
<script>
window.notes=[];window.renderedNotes=[];window.events=[];
function render(){const input=document.querySelector('input');input.setAttribute('value',input.value);const tab=document.querySelector('.tab-item--active').textContent;window.events.push({query:input.value,tab});const area=document.querySelector('.content');area.replaceChildren();
for(const note of window.renderedNotes.filter(n=>n.tab===tab&&n.title.includes(input.value))){const c=document.createElement('div');c.className='note-card';c.setAttribute('data-impression',JSON.stringify({index:{value:{channelTabName:({'已发布':'published','审核中':'reviewing','未通过':'rejected'})[tab]}},noteTarget:{value:{noteId:note.id}}}));const title=document.createElement('span');title.className='note-card__title';title.textContent=note.title;c.append(title);if(note.url){const a=document.createElement('a');a.href=note.url;a.textContent='查看笔记';c.append(a);}area.append(c);}}
document.querySelector('input').oninput=()=>{document.querySelector('.tab-item--active').classList.remove('tab-item--active');document.querySelector('.tab-item').classList.add('tab-item--active');load();};document.querySelector('input').onkeydown=e=>{if(e.key==='Enter')render();};for(const tab of document.querySelectorAll('.tab-item'))tab.onclick=()=>{document.querySelector('.tab-item--active').classList.remove('tab-item--active');if(tab.textContent!=='已发布'){document.querySelector('input').value='';document.querySelector('input').setAttribute('value','');}tab.classList.add('tab-item--active');load();};
async function load(){const tab=document.querySelector('.tab-item--active').textContent;const num={'已发布':'1','审核中':'2','未通过':'3'}[tab];const loader=document.createElement('div');loader.className='d-v-loading';document.body.append(loader);const notes=await(await fetch('/api/galaxy/v2/creator/note/user/posted?tab='+num+'&page=0')).json();window.renderedNotes=notes;render();loader.remove();}
load();
</script>

<!doctype html><meta charset="utf-8">
<div class="header-area"><div class="user-info"><span class="name-box">Redlet demo</span></div></div>
<div class="publish-page-content">
<button id="image-tab">上传图文</button><button hidden>上传图文</button>
<input class="upload-input" type="file" accept=".jpg,.jpeg,.png,.webp" multiple>
<div class="img-preview-area"></div>
<section id="fields"><div class="d-input"><input class="d-text" placeholder="填写标题会有更多赞哦"></div>
<div class="tiptap ProseMirror" contenteditable="true" role="textbox"><p><br></p></div>
</section><div id="declaration"><div class="d-select-content"><span>添加内容类型声明</span></div></div>
<div id="ai-options" hidden><div class="d-option-name">笔记含AI合成内容</div></div>
<div class="permission-card-wrapper"><div class="d-select-content"><span>公开可见</span></div></div>
<div id="visibility-options" hidden><div class="custom-option"><div class="name">公开可见</div></div><div class="custom-option"><div class="name">仅自己可见</div></div></div>
</div>
<button onclick="window.submitted++">发布</button>
<script>
document.querySelector('#image-tab').onclick=()=>{document.querySelector('#fields').hidden=false;};
window.submitted=0; window.uploadNames=[];
document.querySelector('input[type=file]').onchange=async e=>{
 if(window.skipNextUpload)return;
 for(const file of e.target.files){
   window.uploadNames.push(file.name);
   await fetch(window.untypedPut?'https://upload-ae-ali.rnote.com/image':'/upload-image',window.untypedPut?{method:'PUT',body:await file.arrayBuffer()}:{method:'POST',headers:{'content-type':file.type||'image/png'},body:file});
   const card=document.createElement('div');card.className='pr';
   const img=document.createElement('img');img.className='img preview';img.src=window.repeatFirst&&document.querySelector('.pr img')?document.querySelector('.pr img').src:URL.createObjectURL(file);card.append(img);
   const area=document.querySelector('.img-preview-area');
   if(window.reverseNext)area.prepend(card);else area.append(card);
 }
};
document.querySelector('#declaration .d-select-content').onclick=()=>{document.querySelector('#ai-options').hidden=false;};
document.querySelector('.d-option-name').onclick=()=>{
 if(!window.ignoreAI)document.querySelector('#declaration .d-select-content span').textContent='笔记含AI合成内容';
 document.querySelector('#ai-options').hidden=true;
};
document.querySelector('.permission-card-wrapper').onclick=()=>{document.querySelector('#visibility-options').hidden=false;};
for(const option of document.querySelectorAll('.custom-option'))option.onclick=()=>{
 document.querySelector('.permission-card-wrapper .d-select-content span').textContent=option.textContent;
 document.querySelector('#visibility-options').hidden=true;
};
</script>
<style>.content-hide{display:none}</style>
<script>
window.topicOptions={};window.topicDelay=15;window.plainTopic=false;
const topicEditor=document.querySelector('.tiptap');
const topicIds={AI:'aaaaaaaaaaaaaaaaaaaaaaaa','独立开发':'bbbbbbbbbbbbbbbbbbbbbbbb','AI编程':'cccccccccccccccccccccccc','效率工具':'dddddddddddddddddddddddd'};
function showTopicOptions(query,options){
 document.querySelector('#topic-popup')?.remove();
 const wrapper=document.createElement('div');wrapper.id='topic-popup';wrapper.setAttribute('text','#'+query);
 const container=document.createElement('div');container.id='creator-editor-topic-container';container.className='items';wrapper.append(container);
 for(const option of options){
  const item=document.createElement('div');item.className='item';item.setAttribute('data-impression',JSON.stringify({tagTarget:{value:{tagId:option.id}}}));
  const name=document.createElement('span');name.className='name';name.textContent='#'+option.name;item.append(name);
  item.onmousedown=event=>event.preventDefault();
  item.onclick=()=>{
   const selection=getSelection(),cursor=selection.getRangeAt(0);const node=cursor.startContainer;
   if(node.nodeType!==Node.TEXT_NODE)return;
   const start=node.textContent.lastIndexOf('#');if(start<0)return;
   const range=document.createRange();range.setStart(node,start);range.setEnd(node,cursor.startOffset);range.deleteContents();
   const anchor=document.createElement(window.plainTopic?'span':'a');
   if(!window.plainTopic){anchor.className='tiptap-topic';anchor.setAttribute('data-topic',JSON.stringify({id:option.id,name:option.name,link:''}));anchor.setAttribute('contenteditable','false');}
   anchor.textContent='#'+option.name;
   if(!window.plainTopic){const hidden=document.createElement('span');hidden.className='content-hide';hidden.textContent='[话题]#';anchor.append(hidden);}
   range.insertNode(anchor);const spacer=document.createTextNode('\u00a0');anchor.after(spacer);range.setStart(spacer,1);range.collapse(true);selection.removeAllRanges();selection.addRange(range);
   wrapper.remove();topicEditor.focus();
  };
  container.append(item);
 }
 document.body.append(wrapper);
}
topicEditor.addEventListener('input',()=>{
 const selection=getSelection();const node=selection?.anchorNode;
 const query=node?.nodeType===Node.TEXT_NODE?node.textContent.slice(0,selection.anchorOffset).match(/#([^#\n]*)$/)?.[1]:undefined;
 if(query===undefined){document.querySelector('#topic-popup')?.remove();return;}
 if(window.staleTopic)showTopicOptions(window.staleTopic.query,[window.staleTopic.option]);
 const options=window.topicOptions[query]??(query?[{name:query,id:topicIds[query]??'eeeeeeeeeeeeeeeeeeeeeeee'}]:[]);
 setTimeout(()=>showTopicOptions(query,options),window.topicDelay);
});
</script>
